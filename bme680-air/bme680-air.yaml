# BME680 air-quality node
# Seeed Studio XIAO ESP32C3 + BME680 breakout over I2C
#
# Hardware:
#   - Seeed XIAO ESP32C3 (ESP32-C3, 4MB flash, native USB-Serial/JTAG)
#   - BME680 breakout (temperature / humidity / pressure / VOC gas resistance)
#
# Wiring (XIAO, USB-C at top, component side up):
#   BME680 VCC -> 3V3   (right side, 3rd from top)   -- NOT 5V
#   BME680 GND -> GND   (right side, 2nd from top)
#   BME680 SCL -> D5 = GPIO7  (left side, 6th from top)
#   BME680 SDA -> D4 = GPIO6  (left side, 5th from top)
#   BME680 SDO/CS -> leave floating (I2C mode, address per breakout)

substitutions:
  device_name: bme680-air
  friendly_name: "BME680 Air"

  i2c_sda: GPIO6          # XIAO D4
  i2c_scl: GPIO7          # XIAO D5
  bme680_address: "0x77"  # confirmed by i2c bus scan on this breakout

  # Station altitude in metres, for the sea-level pressure correction.
  altitude_m: "250"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

# The XIAO C3 has no USB-UART bridge -- the USB port IS the chip's
# USB-Serial/JTAG peripheral. Without this, serial logs are silent.
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret bme680_api_key

ota:
  - platform: esphome
    password: !secret bme680_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The IoT SSID is hidden -- a normal scan never finds it, so the node sits in
  # an endless "Starting scan" loop. fast_connect skips the scan entirely.
  fast_connect: true
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

# Standalone web UI at http://<device-ip>/ -- live sensor readings without Home
# Assistant or any cloud. `local: true` embeds the JS/CSS in flash instead of
# pulling it from a CDN, so the page works with the WAN down. Costs flash, which
# this board has in abundance.
web_server:
  port: 80
  version: 3
  local: true


i2c:
  sda: ${i2c_sda}
  scl: ${i2c_scl}
  scan: true          # dumps found addresses to the boot log
  id: bus_a
  frequency: 100kHz   # BME680 is happy here; keeps long jumper wires reliable

globals:
  # Rolling clean-air baseline for the gas sensor, in ohms. Flash-backed so a
  # reboot does not throw away days of settling. Zero means "not yet learned".
  - id: gas_baseline
    type: float
    restore_value: true
    initial_value: '0'

# Baseline tracking runs on its own timer rather than per-reading, to keep the
# flash write rate sane. Fast attack, very slow decay: a NEW high instantly
# becomes the baseline (that is genuinely the cleanest air seen), while drift
# back down is deliberately sluggish so one round of cooking cannot convince the
# node that a polluted room is the new normal. 0.002/min ~= a 6-hour time
# constant downward.
interval:
  - interval: 60s
    then:
      - lambda: |-
          const float gas = id(bme_gas_resistance).state;
          if (isnan(gas) || gas <= 0.0f) return;
          if (id(gas_baseline) <= 0.0f || gas > id(gas_baseline)) {
            id(gas_baseline) = gas;
          } else {
            id(gas_baseline) -= (id(gas_baseline) - gas) * 0.002f;
          }

sensor:
  - platform: bme680
    address: ${bme680_address}
    update_interval: 15s

    temperature:
      name: "Temperature"
      id: bme_temperature
      oversampling: 16x
      filters:
        # BME680 self-heats from the gas hotplate; this offset is a placeholder.
        # Calibrate it against a known-good thermometer once it's running.
        - offset: 0.0

    humidity:
      name: "Humidity"
      id: bme_humidity
      oversampling: 16x

    pressure:
      name: "Pressure"
      id: bme_pressure
      oversampling: 16x

    gas_resistance:
      name: "Gas Resistance"
      id: bme_gas_resistance

    # Hotplate profile (platform-level, not under gas_resistance).
    # 320C / 150ms is Bosch's reference point for VOC sensing.
    heater:
      temperature: 320
      duration: 150ms

  # --- Derived values (all computed on-device, no HA dependency) ---

  - platform: template
    name: "Dew Point"
    id: bme_dew_point
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      // Magnus formula
      const float t = id(bme_temperature).state;
      const float rh = id(bme_humidity).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      const float a = 17.62f, b = 243.12f;
      const float gamma = (a * t) / (b + t) + logf(rh / 100.0f);
      return (b * gamma) / (a - gamma);

  - platform: template
    name: "Pressure (Sea Level)"
    id: bme_pressure_sea_level
    unit_of_measurement: "hPa"
    device_class: atmospheric_pressure
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 15s
    lambda: |-
      const float p = id(bme_pressure).state;
      const float t = id(bme_temperature).state;
      if (isnan(p) || isnan(t)) return NAN;
      const float altitude = ${altitude_m}.0f;  // metres above sea level
      return p / powf(1.0f - (altitude / 44330.0f), 5.255f);

  # --- VOC, scored against this sensor's OWN clean-air baseline ---
  #
  # Deliberately NOT a 0-500 "IAQ" index. Absolute VOC indices imply a health
  # judgement a MOX sensor cannot make: it is non-selective (cooking alcohol and
  # off-gassing formaldehyde look identical) and every die has its own baseline,
  # so the raw ohms mean nothing across sensors. What IS meaningful is this
  # sensor's reading relative to the cleanest air it has recently seen here.
  #
  # 100% = as clean as this room gets. Lower = more reducing gases present.
  # Read it as a change detector, not as an air quality rating.
  #
  # Known limitation, inherent to every baseline-relative VOC metric including
  # Bosch's BSEC: a room that is *persistently* bad re-baselines to its own
  # badness and reads 100%. This catches changes, never a chronic condition.
  - platform: template
    name: "VOC Relative"
    id: bme_voc_relative
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    icon: "mdi:air-filter"
    update_interval: 15s
    lambda: |-
      const float gas = id(bme_gas_resistance).state;
      const float base = id(gas_baseline);
      if (isnan(gas) || gas <= 0.0f || base <= 0.0f) return NAN;
      float pct = (gas / base) * 100.0f;
      if (pct > 100.0f) pct = 100.0f;   // baseline update lags by up to 60s
      return pct;

  # The baseline itself, exposed so you can watch burn-in finish. While this is
  # still climbing, VOC Relative sits pinned near 100% and means nothing.
  - platform: template
    name: "VOC Baseline"
    id: bme_gas_baseline_sensor
    unit_of_measurement: "Ω"
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: "mdi:chart-bell-curve"
    update_interval: 60s
    lambda: 'return id(gas_baseline) > 0.0f ? id(gas_baseline) : NAN;'

  - platform: uptime
    name: "Uptime"

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "ESPHome Version"
  - platform: wifi_info
    ip_address:
      name: "IP Address"
